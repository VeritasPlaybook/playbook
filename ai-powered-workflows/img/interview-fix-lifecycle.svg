<text x="79.0" y="448.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.5" fill="#1f2328" text-anchor="start" font-weight="600">Closed</text>
<text x="79.0" y="474.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606a" text-anchor="start">Mark it locked in the run log so no</text>
