<text x="379.0" y="148.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" text-anchor="middle">not a list. A list is a way</text>
<text x="379.0" y="167.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" text-anchor="middle">of ignoring all of them politely</text>
